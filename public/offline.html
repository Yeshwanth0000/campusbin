<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>You're offline — CampusBin</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #0f172a; --muted: #64748b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #020617; --fg: #f1f5f9; --muted: #94a3b8; } }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
  }
  .logo {
    width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #4f46e5, #10b981);
    color: #fff; font-weight: 800; font-size: 30px; letter-spacing: -1px;
  }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p { margin: 0 auto 24px; max-width: 320px; color: var(--muted); font-size: 15px; line-height: 1.5; }
  button {
    border: 0; border-radius: 8px; padding: 12px 24px; font: inherit; font-weight: 600;
    background: #4f46e5; color: #fff; cursor: pointer;
  }
</style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">CB</div>
    <h1>You're offline</h1>
    <p>CampusBin needs an internet connection to show listings and messages. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
